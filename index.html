<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#252B3A">
  <title>KOJOKO AI — Каёко</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- Боковая панель -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">🌸</span>
          <span>KOJOKO AI</span>
        </div>
        <span class="version">v0.2</span>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <span>＋</span> Новый чат
      </button>

      <div class="history-section">
        <div class="section-title">ИСТОРИЯ ЧАТОВ</div>
        <div id="chatHistory" class="chat-history"></div>
      </div>

      <div class="sidebar-nav">
        <button class="nav-btn" id="projectsBtn">
          <span>📁</span> Проекты
        </button>
        <button class="nav-btn" id="imagesBtn">
          <span>🖼️</span> Изображения
        </button>
        <button class="nav-btn" id="settingsBtn">
          <span>⚙️</span> Настройки
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="profile-icon">K</div>
        <div class="profile-info">
          <strong>Каёко</strong>
          <small>Твой AI-помощник</small>
        </div>
      </div>
    </aside>

    <!-- Основная область -->
    <main class="main">

      <header class="topbar">
        <div class="chat-title" id="chatTitle">Новый чат</div>

        <div class="kayoko-status">
          <div class="status-text">
            <strong>Каёко</strong>
            <small id="mood">Ожидаю сообщения...</small>
          </div>
          <img
            src="images/kayoko-idle.jpg"
            id="kayoko"
            class="kayoko-avatar"
            alt="Каёко"
          >
        </div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">🌸</div>
          <h1>Привет! Я Каёко.</h1>
          <p>Чем я могу тебе помочь сегодня?</p>

          <div class="suggestions">
            <button class="suggestion" data-prompt="Помоги написать простой код">
              💻 Помоги с кодом
            </button>
            <button class="suggestion" data-prompt="Помоги решить школьное задание">
              📚 Решить задание
            </button>
            <button class="suggestion" data-prompt="Давай просто поговорим">
              💬 Поговорить
            </button>
          </div>
        </div>

        <div id="messages" class="messages"></div>
      </section>

      <footer class="composer">
        <form id="chatForm">
          <textarea
            id="prompt"
            placeholder="Напиши сообщение Каёко..."
            rows="1"
          ></textarea>

          <button type="submit" id="sendBtn" aria-label="Отправить">
            ➤
          </button>
        </form>

        <div class="composer-note">
          KOJOKO AI может иногда ошибаться. Проверяй важную информацию.
        </div>
      </footer>

    </main>
  </div>

  <!-- Кнопка открытия и закрытия боковой панели -->
  <button id="toggleSidebar" class="sidebar-toggle" aria-label="Свернуть меню">
    ‹
  </button>

  <div id="toast" class="toast"></div>

  <script src="brain.js"></script>
  <script src="app.js"></script>
</body>
</html>
